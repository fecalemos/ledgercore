services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgercore-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledgercore
    volumes:
      - ledgercore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  ledgercore_pgdata: